name: Deploy to Vercel

# Production deploys on every push to main. Vercel's own Git integration is not
# linked to this project, so this does the same job with the Vercel CLI.
# Needs one repo secret: VERCEL_TOKEN (vercel.com/account/tokens).

on:
  push:
    branches: [main]
  workflow_dispatch: {}   # manual "Run workflow" button

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Not secret: they identify the project, they do not grant access.
      VERCEL_ORG_ID: team_dJ9Db21YGIYxRdVsktfLX6ok
      VERCEL_PROJECT_ID: prj_DNYbj04ebzwMrqyBRIQZP1hP8Xwu
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Check the token is set
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "::error::Add a VERCEL_TOKEN repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Vercel builds remotely, so no npm install is needed here.
      - name: Deploy to production
        run: npx --yes vercel@66.6.0 deploy --prod --yes --token "$VERCEL_TOKEN"
